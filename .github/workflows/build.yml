name: Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Tạo Release với phiên bản này (vd 0.1.0). Để trống = chỉ build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Xác định phiên bản
        id: ver
        shell: pwsh
        run: |
          $in = '${{ github.event.inputs.release_version }}'
          if ($in) {
            $v = $in.TrimStart('v')
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = "0.1.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build
        run: dotnet build src/DeskMate/DeskMate.csproj -c Debug

      - name: Publish (single-file, self-contained)
        run: dotnet publish src/DeskMate/DeskMate.csproj -c Release -o publish -p:Version=${{ steps.ver.outputs.version }}

      - name: Cài Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Đóng gói installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\DeskMate.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path publish\* -DestinationPath "dist\DeskMate-${{ steps.ver.outputs.version }}-portable.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: DeskMate-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Tạo Release (tag v* hoặc chạy tay có nhập phiên bản)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DeskMate v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
