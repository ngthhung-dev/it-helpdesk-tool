name: Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Phát hành bản mới — tự tăng phiên bản từ bản phát hành gần nhất (1.0.1 → … → 1.0.99 → 1.1.0 → … → 1.99.99 → 2.0.0)'
        type: boolean
        default: false
      release_version:
        description: 'Hoặc tự nhập phiên bản (vd 1.2.3). Để trống = dùng số tự tăng / chỉ build'
        required: false
        default: ''
      replace_existing:
        description: 'Nếu release cùng phiên bản đã có thì xoá và tạo lại'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # cần đủ tag để tính phiên bản kế tiếp

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Xác định phiên bản
        id: ver
        shell: pwsh
        run: |
          $in = '${{ github.event.inputs.release_version }}'
          $auto = '${{ github.event.inputs.release }}' -eq 'true'
          if ($in) {
            $v = $in.TrimStart('v')
          } elseif ($auto) {
            # Phiên bản kế tiếp: tăng số cuối; quá 99 thì sang số giữa, số giữa quá 99 thì sang số đầu
            $tags = git tag --list 'v*' | ForEach-Object { $_.TrimStart('v') } | Where-Object { $_ -match '^\d+\.\d+\.\d+$' }
            $last = $tags | Sort-Object { [version]$_ } | Select-Object -Last 1
            if (-not $last) { $last = '1.0.0' }
            $p = $last.Split('.') | ForEach-Object { [int]$_ }
            $ma, $mi, $pa = $p[0], $p[1], ($p[2] + 1)
            if ($pa -gt 99) { $pa = 0; $mi++ }
            if ($mi -gt 99) { $mi = 0; $ma++ }
            $v = "$ma.$mi.$pa"
            Write-Host "Bản gần nhất: $last → bản mới: $v"
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            # mặc định lấy <Version> trong .csproj
            $v = ([xml](Get-Content src/ITHelpdeskTool/ITHelpdeskTool.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build
        run: dotnet build src/ITHelpdeskTool/ITHelpdeskTool.csproj -c Debug

      - name: Publish (single-file, self-contained)
        run: dotnet publish src/ITHelpdeskTool/ITHelpdeskTool.csproj -c Release -o publish -p:Version=${{ steps.ver.outputs.version }}

      - name: Kiểm tra thông tin file .exe
        shell: pwsh
        run: |
          $f = (Get-Item publish\ITHelpdeskTool.exe).VersionInfo
          $f | Format-List FileDescription, FileVersion, ProductName, ProductVersion, CompanyName, LegalCopyright
          if ($f.ProductName -ne 'IT Helpdesk Tool') { throw 'Sai ProductName' }

      - name: Cài Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Đóng gói installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\ITHelpdeskTool.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path publish\* -DestinationPath "dist\ITHelpdeskTool-${{ steps.ver.outputs.version }}-portable.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: ITHelpdeskTool-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Xoá release cũ cùng phiên bản (nếu chọn)
        if: (github.event.inputs.release_version != '' || github.event.inputs.release == 'true') && github.event.inputs.replace_existing == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${{ steps.ver.outputs.version }}" --cleanup-tag --yes -R ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) { Write-Host "Không có release cũ để xoá"; $global:LASTEXITCODE = 0 }

      - name: Tạo Release (tag v* hoặc chạy tay có nhập phiên bản)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_version != '' || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: IT Helpdesk Tool v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: false
