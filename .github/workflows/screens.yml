name: Screenshots

# Chạy app thật trên máy Windows của GitHub, chụp màn hình các trang và báo cáo HTML,
# rồi đẩy ảnh lên nhánh ci-screens để xem lại.
on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Các trang cần chụp (key, cách nhau dấu phẩy)'
        default: 'report,dashboard,about'
      theme:
        description: 'Giao diện: system, light, dark'
        default: 'system'
      auth:
        description: 'Cách đăng nhập: local / online'
        default: 'local'

permissions:
  contents: write

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/ITHelpdeskTool/ITHelpdeskTool.csproj -c Release -o publish -p:TestBuild=true -p:AuthMode=${{ github.event.inputs.auth }}

      - name: Chụp màn hình
        shell: pwsh
        env:
          ADMIN_PW: ${{ secrets.ADMIN_TEST_PW }}
        run: |
          try { Set-DisplayResolution -Width 1600 -Height 1000 -Force -ErrorAction Stop } catch { Write-Host "Không đổi được độ phân giải: $_" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class U {
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int n);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);
          }
          "@
          New-Item -ItemType Directory shots -Force | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Màn hình: $($b.Width)x$($b.Height)"
          foreach ($page in '${{ github.event.inputs.pages }}'.Split(',')) {
            $page = $page.Trim()
            if ($page -eq 'login-online') {
              # Bản online: sai mật khẩu → đúng (tài khoản quản trị) → mở Quản lý tài khoản
              Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
              function Open-App2 { $x = Start-Process publish\ITHelpdeskTool.exe -ArgumentList '--page','about' -PassThru; $t = [Diagnostics.Stopwatch]::StartNew(); while ($x.MainWindowHandle -eq 0 -and $t.ElapsedMilliseconds -lt 30000) { Start-Sleep -Milliseconds 100; $x.Refresh() }; Start-Sleep 3; [U]::SetForegroundWindow($x.MainWindowHandle) | Out-Null; Start-Sleep 1; $x }
              function Keys($k) { [System.Windows.Forms.SendKeys]::SendWait($k); Start-Sleep -Milliseconds 300 }
              $p = Open-App2; Shot 'online-1-login'
              Keys '^a'; Keys 'ngthhung'; Keys '{TAB}'; Keys 'sai-mat-khau'; Keys '{ENTER}'; Start-Sleep 4; Shot 'online-2-wrong'
              [System.Windows.Forms.SendKeys]::SendWait($env:ADMIN_PW); Start-Sleep -Milliseconds 300; Keys '{ENTER}'; Start-Sleep 7
              $p.Refresh(); [U]::ShowWindow($p.MainWindowHandle, 3) | Out-Null; Start-Sleep 2; Shot 'online-3-about'
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Quản lý tài khoản')
              $btn = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond)
              Write-Host "::notice title=login::nút quản lý: $([bool]$btn)"
              if ($btn) {
                $bp = [System.Windows.Automation.TreeWalker]::ControlViewWalker.GetParent($btn)
                foreach ($el in @($btn, $bp)) { try { $el.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); break } catch { } }
                Start-Sleep 8; Shot 'online-4-accounts'
              }
              Stop-Process $p -Force -ErrorAction SilentlyContinue; Start-Sleep 1
              continue
            }
            if ($page -eq 'login') {
              # Thử luồng đăng nhập thật: tạo tài khoản lần đầu → vào app → mở lại → nhập sai → nhập đúng
              Remove-Item "$env:ProgramData\ngthhung\IT Helpdesk Tool\auth.dat" -Force -ErrorAction SilentlyContinue
              function Open-App { $x = Start-Process publish\ITHelpdeskTool.exe -PassThru; $t = [Diagnostics.Stopwatch]::StartNew(); while ($x.MainWindowHandle -eq 0 -and $t.ElapsedMilliseconds -lt 30000) { Start-Sleep -Milliseconds 100; $x.Refresh() }; Start-Sleep 2; [U]::SetForegroundWindow($x.MainWindowHandle) | Out-Null; Start-Sleep 1; $x }
              function Keys($k) { [System.Windows.Forms.SendKeys]::SendWait($k); Start-Sleep -Milliseconds 300 }
              $p = Open-App; Shot 'login-1-setup'
              Keys 'tester'; Keys '{TAB}'; Keys '123'; Keys '{TAB}'; Keys '123'; Keys '{ENTER}'; Start-Sleep 1; Shot 'login-2-short'
              Keys '+{TAB}'; Keys '^a'; Keys 'Abc@12345'; Keys '{TAB}'; Keys '^a'; Keys 'Abc@12345'; Keys '{ENTER}'; Start-Sleep 6
              $p.Refresh(); Shot 'login-3-main'; Write-Host "::notice title=login::sau khi tạo: title='$($p.MainWindowTitle)' exited=$($p.HasExited)"
              Stop-Process $p -Force -ErrorAction SilentlyContinue; Start-Sleep 2
              Write-Host "::notice title=login::auth.dat=$(Test-Path "$env:ProgramData\ngthhung\IT Helpdesk Tool\auth.dat")"
              $p = Open-App; Shot 'login-4-login'
              Keys 'sai-mat-khau'; Keys '{ENTER}'; Start-Sleep 2; Shot 'login-5-wrong'
              Keys 'Abc@12345'; Keys '{ENTER}'; Start-Sleep 6; Shot 'login-6-ok'
              Stop-Process $p -Force -ErrorAction SilentlyContinue; Start-Sleep 1
              continue
            }
            $p = Start-Process publish\ITHelpdeskTool.exe -ArgumentList '--no-login', '--page', $page, '--theme', '${{ github.event.inputs.theme }}' -PassThru
            $sw = [Diagnostics.Stopwatch]::StartNew()
            while ($p.MainWindowHandle -eq 0 -and $sw.ElapsedMilliseconds -lt 30000) { Start-Sleep -Milliseconds 100; $p.Refresh() }
            [U]::ShowWindow($p.MainWindowHandle, 3) | Out-Null      # phóng to
            [U]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds ($(if ($page -match '^(report|store|office)') { 16 } else { 5 }))
            Shot "$($page -replace '/','_')-1"
            if ($page -notin 'dashboard','about') {
              # cuộn xuống từng trang để chụp phần dưới
              [U]::SetCursorPos([int]($b.Width * 0.6), [int]($b.Height * 0.6)) | Out-Null
              foreach ($i in 2..6) {
                foreach ($k in 1..8) { [U]::mouse_event(0x0800, 0, 0, -120, 0); Start-Sleep -Milliseconds 30 }
                Start-Sleep -Milliseconds 600
                Shot "$($page -replace '/','_')-$i"
              }
            }
            Stop-Process $p -Force; Start-Sleep 1
          }

          # Báo cáo HTML xuất ra, chụp bằng Edge headless
          Start-Process publish\ITHelpdeskTool.exe -ArgumentList '--report', "$PWD\shots\report" -Wait
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (Test-Path $edge) {
            & $edge --headless=new --disable-gpu --hide-scrollbars --window-size=1200,5200 "--screenshot=$PWD\shots\report-html.png" "file:///$($PWD -replace '\\','/')/shots/report.html"
            Start-Sleep 5
          }
          Get-ChildItem shots | ForEach-Object { Write-Host "::notice title=shot::$($_.Name) $([int]($_.Length/1KB)) KB" }

      - name: Đẩy ảnh lên nhánh ci-screens
        shell: pwsh
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          Copy-Item shots $env:RUNNER_TEMP\shots -Recurse
          git checkout --orphan ci-screens
          git rm -rf . -q
          git clean -fdxq
          Copy-Item $env:RUNNER_TEMP\shots\* .
          Remove-Item *.json, *.txt -ErrorAction SilentlyContinue
          git add -A
          git commit -q -m "Screenshots $env:GITHUB_SHA"
          git push -f origin ci-screens
