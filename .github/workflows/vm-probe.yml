name: VM probe

# Thăm dò máy Linux của GitHub có chạy được máy ảo Windows (QEMU + KVM) để thử tính năng "Cài lại Windows"
# mà không cần máy thật. Không build, không đụng app. Kết quả: báo cáo + ảnh chụp màn hình máy ảo trong artifact.
on:
  workflow_dispatch:
  push:
    branches: [feat/reinstall-core]
    paths: [.github/workflows/vm-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Windows 11 Enterprise bản dùng thử 90 ngày, link chính thức từ Microsoft Evaluation Center
      WIN11_EVAL: https://go.microsoft.com/fwlink/?LinkId=2382600&clcid=0x409&culture=en-us&country=us
      VIRTIO: https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso
    steps:
      - name: Máy runner
        run: |
          mkdir -p out
          {
            echo "## CPU / RAM"; nproc; grep -m1 'model name' /proc/cpuinfo; free -g
            echo "## Cờ ảo hoá CPU"; grep -c -E 'vmx|svm' /proc/cpuinfo || true
            echo "## /dev/kvm"; ls -l /dev/kvm || echo "KHÔNG có /dev/kvm"
            echo "## Ổ đĩa ban đầu"; df -h / /mnt
          } | tee out/report.txt

      - name: Bật quyền KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm | tee -a out/report.txt

      - name: Dọn ổ (bỏ bộ công cụ không dùng)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null || true
          { echo "## Ổ đĩa sau khi dọn"; df -h / /mnt; } | tee -a out/report.txt

      - name: Cài QEMU, OVMF, swtpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf swtpm socat imagemagick > /dev/null
          { echo "## QEMU"; qemu-system-x86_64 --version | head -1; echo "## OVMF"; ls /usr/share/OVMF/; } | tee -a out/report.txt

      - name: Tải ISO Windows 11 Enterprise (dùng thử) và virtio-win
        run: |
          sudo mkdir -p /mnt/vm && sudo chown $USER /mnt/vm
          s=$(date +%s)
          curl -sSL --retry 3 -o /mnt/vm/win11.iso "$WIN11_EVAL"
          e=$(date +%s)
          curl -sSL --retry 3 -o /mnt/vm/virtio-win.iso "$VIRTIO"
          {
            echo "## Tải ISO"
            ls -l /mnt/vm
            echo "Win11 ISO: $(( (e-s) )) giây"
            file /mnt/vm/win11.iso
          } | tee -a out/report.txt
          # Tên bản Windows trong ISO (đọc nhãn đĩa)
          isoinfo -d -i /mnt/vm/win11.iso 2>/dev/null | grep -i 'Volume id' | tee -a out/report.txt || true

      - name: Bật thử máy ảo UEFI (Secure Boot + TPM) và BIOS từ ISO
        run: |
          cd /mnt/vm
          shot() { echo "screendump $2" | socat - unix-connect:$1 > /dev/null; sleep 1; convert "$2" "$GITHUB_WORKSPACE/out/$(basename "$2" .ppm).png" || true; }
          keys() { for i in $(seq 1 10); do echo "sendkey ret" | socat - unix-connect:$1 > /dev/null; sleep 1; done; }

          qemu-img create -f qcow2 uefi.qcow2 64G > /dev/null
          qemu-img create -f qcow2 bios.qcow2 64G > /dev/null
          cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd vars.fd
          mkdir -p tpm && swtpm socket --tpmstate dir=tpm --ctrl type=unixio,path=tpm/sock --tpm2 --daemon

          # UEFI + Secure Boot + TPM 2.0 (giống máy Win 11 thật)
          qemu-system-x86_64 -enable-kvm -machine q35,smm=on -cpu host -smp 4 -m 6144 \
            -global driver=cfi.pflash01,property=secure,value=on \
            -drive if=pflash,format=raw,unit=0,file=/usr/share/OVMF/OVMF_CODE_4M.ms.fd,readonly=on \
            -drive if=pflash,format=raw,unit=1,file=vars.fd \
            -chardev socket,id=chrtpm,path=tpm/sock -tpmdev emulator,id=tpm0,chardev=chrtpm -device tpm-tis,tpmdev=tpm0 \
            -drive file=uefi.qcow2,if=none,id=d0 -device ahci,id=ahci -device ide-hd,drive=d0,bus=ahci.0 \
            -drive file=win11.iso,media=cdrom,if=none,id=cd0 -device ide-cd,drive=cd0,bus=ahci.1 \
            -display none -monitor unix:/tmp/uefi.mon,server,nowait -daemonize
          keys /tmp/uefi.mon &
          sleep 25; shot /tmp/uefi.mon /tmp/uefi-25s.ppm
          sleep 60; shot /tmp/uefi.mon /tmp/uefi-85s.ppm
          sleep 60; shot /tmp/uefi.mon /tmp/uefi-145s.ppm

          # BIOS / MBR (máy cũ)
          qemu-system-x86_64 -enable-kvm -machine pc -cpu host -smp 4 -m 6144 \
            -drive file=bios.qcow2,if=ide,index=0 -drive file=win11.iso,media=cdrom,if=ide,index=2 -boot d \
            -display none -monitor unix:/tmp/bios.mon,server,nowait -daemonize
          sleep 30; shot /tmp/bios.mon /tmp/bios-30s.ppm
          sleep 60; shot /tmp/bios.mon /tmp/bios-90s.ppm

          { echo "## Máy ảo"; pgrep -a qemu-system | cut -c1-120; echo "## Ổ đĩa cuối"; df -h /mnt; } | tee -a "$GITHUB_WORKSPACE/out/report.txt"

      - name: Tóm tắt
        if: always()
        run: cat out/report.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: vm-probe
          path: out/
